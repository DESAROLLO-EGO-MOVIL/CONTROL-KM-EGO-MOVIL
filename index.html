<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Kilometraje - Rutas Ego Móvil</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 30px 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
    }

    .header-logo {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-logo-container {
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .brand-logo-img {
      max-height: 60px;
      max-width: 190px;
      object-fit: contain;
    }

    .logo-badge {
      display: inline-block;
      background: #e8f0fe;
      color: #1a73e8;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1.5px;
      padding: 6px 14px;
      border-radius: 20px;
    }

    h2 {
      color: #1f2937;
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 13.5px;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      color: #374151;
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      color: #111827;
      outline: none;
      background-color: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: #1a73e8;
      color: #ffffff;
      margin-top: 8px;
    }

    .btn-primary:hover {
      background-color: #1557b0;
    }

    .btn-secondary {
      background-color: #f3f4f6;
      color: #4b5563;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: #e5e7eb;
    }

    .feedback-msg {
      margin-top: 14px;
      padding: 11px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      display: none;
    }

    .feedback-msg.error {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .feedback-msg.success {
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    #vista-formulario {
      display: none;
    }

    .active-route-badge {
      display: inline-flex;
      align-items: center;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      font-weight: 700;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- PANTALLA 1: LOGIN -->
  <div id="vista-login">
    <div class="header-logo">
      <div class="brand-logo-container">
        <img src="https://res.cloudinary.com/dygb7qjgt/image/upload/v1788889850/EGO_PIC_xg3vk1.png" alt="EGO MÓVIL" class="brand-logo-img" id="img-logo-login" onerror="mostrarTextoLogo('img-logo-login', 'badge-logo-login')">
        <span class="logo-badge" id="badge-logo-login" style="display: none;">EGO MÓVIL</span>
      </div>
      <h2>Control de Flota</h2>
      <p class="subtitle">Ingresa la ruta asignada y contraseña para acceder</p>
    </div>

    <div class="form-group">
      <label for="input-ruta">Ruta</label>
      <input type="text" id="input-ruta" placeholder="Ej: 527 o RUTA 527" autocomplete="off" autocapitalize="characters">
    </div>

    <div class="form-group">
      <label for="input-pass">Contraseña</label>
      <input type="password" id="input-pass" placeholder="Ingresa contraseña">
    </div>

    <button class="btn-primary" onclick="ejecutarLogin()">Iniciar Sesión</button>
    <div id="msg-login" class="feedback-msg error"></div>
  </div>

  <!-- PANTALLA 2: FORMULARIO DE CAPTURA -->
  <div id="vista-formulario">
    <div class="header-logo">
      <div class="brand-logo-container">
        <img src="https://res.cloudinary.com/dygb7qjgt/image/upload/v1788889850/EGO_PIC_xg3vk1.png" alt="EGO MÓVIL" class="brand-logo-img" id="img-logo-form" onerror="mostrarTextoLogo('img-logo-form', 'badge-logo-form')">
        <span class="logo-badge" id="badge-logo-form" style="display: none;">EGO MÓVIL</span>
      </div>
      <div class="active-route-badge">
        📍 <span id="label-ruta-activa" style="margin-left: 6px;">RUTA</span>
      </div>
      <h2>Registro de Kilometraje</h2>
      <p class="subtitle">Ingresa la unidad, fecha y kilometraje actual</p>
    </div>

    <div class="form-group">
      <label for="input-unidad">Número de Unidad / Económico</label>
      <input type="text" id="input-unidad" placeholder="Ej: 6047" autocomplete="off" autocapitalize="characters">
    </div>

    <div class="form-group">
      <label for="input-fecha">Fecha del Registro</label>
      <input type="date" id="input-fecha">
    </div>

    <div class="form-group">
      <label for="input-km">Kilometraje (Odómetro)</label>
      <input type="number" id="input-km" placeholder="Ej: 142500" min="0" max="2500000" inputmode="numeric">
    </div>

    <button class="btn-primary" id="btn-guardar" onclick="enviarRegistro()">Guardar Kilometraje</button>
    <button class="btn-secondary" onclick="cerrarSesion()">Cambiar de Ruta / Salir</button>
    <div id="msg-formulario" class="feedback-msg"></div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxZZW_-ACDrdCJ395cIR4mhfL6LNrJUinP3WhLVkIPDyMd8V6M258rV9gGTCNhULGmQ/exec";

  // MATRIZ DE RUTAS OFICIALES Y SUS CONTRASEÑAS
  const CREDENCIALES_RUTAS = {
    "RUTA 109": "EGO-109",
    "RUTA 117": "EGO-117",
    "RUTA 527": "EGO-527",
    "RUTA 218": "EGO-218",
    "RUTA 601": "EGO-601",
    "RUTA 223": "EGO-223",
    "RUTA 68":  "EGO-68",
    "RUTA 228": "EGO-228",
    "RUTA 1":   "EGO-1",
    "RUTA 310": "EGO-310",
    "RUTA 201": "EGO-201",
    "RUTA 311": "EGO-311",
    "RUTA 313": "EGO-313",
    "RUTA 39":  "EGO-39",
    "RUTA 41":  "EGO-41"
  };

  let rutaActual = "";

  function mostrarTextoLogo(imgId, badgeId) {
    const img = document.getElementById(imgId);
    const badge = document.getElementById(badgeId);
    if (img) img.style.display = "none";
    if (badge) badge.style.display = "inline-block";
  }

  function mostrarMensaje(elementoId, texto, esError) {
    const el = document.getElementById(elementoId);
    el.innerText = texto;
    el.className = "feedback-msg " + (esError ? "error" : "success");
    el.style.display = "block";
  }

  function ocultarMensaje(elementoId) {
    const el = document.getElementById(elementoId);
    el.style.display = "none";
  }

  function setFechaHoy() {
    const hoy = new Date();
    const anio = hoy.getFullYear();
    const mes = String(hoy.getMonth() + 1).padStart(2, "0");
    const dia = String(hoy.getDate()).padStart(2, "0");
    const formatoFecha = `${anio}-${mes}-${dia}`;
    const inputFecha = document.getElementById("input-fecha");
    inputFecha.value = formatoFecha;
    inputFecha.max = formatoFecha;
  }

  function abrirFormulario(ruta) {
    rutaActual = ruta;
    localStorage.setItem("ego_ruta_activa", ruta);
    document.getElementById("label-ruta-activa").innerText = rutaActual;
    document.getElementById("vista-login").style.display = "none";
    document.getElementById("vista-formulario").style.display = "block";
    setFechaHoy();
    document.getElementById("input-unidad").focus();
  }

  function ejecutarLogin() {
    let rutaIngresada = document.getElementById("input-ruta").value.trim().replace(/\s+/g, " ").toUpperCase();
    const passIngresada = document.getElementById("input-pass").value.trim();

    ocultarMensaje("msg-login");

    if (!rutaIngresada || !passIngresada) {
      mostrarMensaje("msg-login", "Ingresa tanto la ruta como la contraseña.", true);
      return;
    }

    // Si escriben solo el número (ej: "527" o "68"), se le añade "RUTA "
    if (!rutaIngresada.startsWith("RUTA ") && !isNaN(rutaIngresada)) {
      rutaIngresada = "RUTA " + rutaIngresada;
    }

    const passEsperada = CREDENCIALES_RUTAS[rutaIngresada];

    if (!passEsperada || passIngresada !== passEsperada) {
      mostrarMensaje("msg-login", "Ruta o contraseña incorrecta.", true);
      return;
    }

    abrirFormulario(rutaIngresada);
  }

  async function enviarRegistro() {
    const unidad = document.getElementById("input-unidad").value.trim().toUpperCase();
    const fecha = document.getElementById("input-fecha").value;
    const kmVal = document.getElementById("input-km").value.trim();
    const btn = document.getElementById("btn-guardar");

    ocultarMensaje("msg-formulario");

    if (!unidad || !fecha || !kmVal) {
      mostrarMensaje("msg-formulario", "Debes llenar todos los campos requeridos.", true);
      return;
    }

    const km = Number(kmVal);
    if (isNaN(km) || km < 0 || km > 2500000) {
      mostrarMensaje("msg-formulario", "Ingresa un kilometraje válido.", true);
      return;
    }

    btn.disabled = true;
    btn.innerText = "Guardando...";

    const params = new URLSearchParams();
    params.append("ruta", rutaActual);
    params.append("unidad", unidad);
    params.append("fecha", fecha);
    params.append("km", km);

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params.toString()
      });

      mostrarMensaje("msg-formulario", `✓ Guardado: Unidad ${unidad} (${km.toLocaleString()} km)`, false);
      document.getElementById("input-unidad").value = "";
      document.getElementById("input-km").value = "";
      document.getElementById("input-unidad").focus();

    } catch (error) {
      mostrarMensaje("msg-formulario", "Error al enviar datos: " + error.message, true);
    } finally {
      btn.disabled = false;
      btn.innerText = "Guardar Kilometraje";
    }
  }

  function cerrarSesion() {
    localStorage.removeItem("ego_ruta_activa");
    rutaActual = "";
    document.getElementById("input-ruta").value = "";
    document.getElementById("input-pass").value = "";
    document.getElementById("input-unidad").value = "";
    document.getElementById("input-km").value = "";
    ocultarMensaje("msg-formulario");
    ocultarMensaje("msg-login");
    document.getElementById("vista-formulario").style.display = "none";
    document.getElementById("vista-login").style.display = "block";
    document.getElementById("input-ruta").focus();
  }

  // Navegación con Enter
  document.getElementById("input-ruta").addEventListener("keypress", (e) => {
    if (e.key === "Enter") document.getElementById("input-pass").focus();
  });
  document.getElementById("input-pass").addEventListener("keypress", (e) => {
    if (e.key === "Enter") ejecutarLogin();
  });
  document.getElementById("input-unidad").addEventListener("keypress", (e) => {
    if (e.key === "Enter") document.getElementById("input-km").focus();
  });
  document.getElementById("input-km").addEventListener("keypress", (e) => {
    if (e.key === "Enter") enviarRegistro();
  });

  // Restaurar sesión si ya estaba iniciada
  window.addEventListener("DOMContentLoaded", () => {
    const rutaGuardada = localStorage.getItem("ego_ruta_activa");
    if (rutaGuardada && CREDENCIALES_RUTAS[rutaGuardada]) {
      abrirFormulario(rutaGuardada);
    }
  });
</script>

</body>
</html>
